[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "doublesum-python"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# 公開から 7 日未満の版は解決に使わない (乗っ取られた版を掴まないためのクールダウン)。
# 脆弱性の修正版をすぐ入れたいときは exclude-newer-package で個別に外す。
exclude-newer = "7 days"
